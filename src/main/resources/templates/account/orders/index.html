<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng của tôi - Badminton Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 80px;
        }

        .card {
            border: none;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container py-5">
        <h2 class="mb-4 fw-bold">Lịch sử đơn hàng</h2>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="py-3 ps-4">Mã đơn hàng</th>
                                <th class="py-3">Ngày đặt</th>
                                <th class="py-3">Tổng tiền</th>
                                <th class="py-3">Trạng thái</th>
                                <th class="py-3 text-end pe-4">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${orders}">
                                <td class="ps-4 align-middle fw-bold" th:text="${order.orderNumber}">ORD-001</td>
                                <td class="align-middle"
                                    th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                                <td class="align-middle text-primary fw-bold"
                                    th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT') + ' ₫'}">
                                </td>
                                <td class="align-middle">
                                    <span class="badge" th:classappend="${
                                              order.status.name() == 'DELIVERED' ? 'bg-success' : 
                                              (order.status.name() == 'CANCELLED' ? 'bg-danger' : 
                                              (order.status.name() == 'PENDING' ? 'bg-warning text-dark' : 'bg-info'))
                                          }" th:text="${
                                              order.status.name() == 'PENDING' ? 'Chờ xác nhận' :
                                              (order.status.name() == 'CONFIRMED' ? 'Đã xác nhận' :
                                              (order.status.name() == 'PROCESSING' ? 'Đang xử lý' :
                                              (order.status.name() == 'STRINGING' ? 'Đang đan vợt' :
                                              (order.status.name() == 'READY_TO_SHIP' ? 'Sẵn sàng giao' :
                                              (order.status.name() == 'SHIPPED' ? 'Đang vận chuyển' :
                                              (order.status.name() == 'DELIVERED' ? 'Đã giao hàng' :
                                              (order.status.name() == 'CANCELLED' ? 'Đã hủy' :
                                              (order.status.name() == 'REFUNDED' ? 'Đã hoàn tiền' : order.status))))))))
                                          }">Chờ xác nhận</span>
                                </td>
                                <td class="text-end pe-4 align-middle">
                                    <a th:href="@{/orders/{id}(id=${order.orderId})}"
                                        class="btn btn-outline-primary btn-sm rounded-pill">
                                        Chi tiết <i class="fas fa-arrow-right ms-1"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(orders)}">
                                <td colspan="5" class="text-center py-5 text-muted">Bạn chưa có đơn hàng nào.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
