<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi yêu cầu bảo hành</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 80px;
        }

        .card {
            border: none;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-warning text-dark py-3">
                        <h4 class="mb-0"><i class="fas fa-shield-alt me-2"></i>Gửi yêu cầu bảo hành</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/account/requests/warranty}" th:object="${warrantyRequest}" method="post">
                            <input type="hidden" th:field="*{orderItemId}">

                            <div class="mb-3">
                                <label class="form-label fw-bold">Vấn đề gặp phải <span
                                        class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{issueType}" required>
                                    <option value="" disabled selected>-- Chọn loại lỗi --</option>
                                    <option th:each="i : ${issueTypes}" th:value="${i}" th:text="${i}"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Mô tả sự cố <span class="text-danger">*</span></label>
                                <textarea class="form-control" th:field="*{description}" rows="5" required
                                    placeholder="Mô tả chi tiết lỗi, hoàn cảnh xảy ra..."></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Hình ảnh/Video bằng chứng (URLs)</label>
                                <textarea class="form-control" th:field="*{images}" rows="2"
                                    placeholder="Dán link ảnh/cloud video, phân tách bởi dấu phẩy..."></textarea>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/orders}" class="btn btn-secondary me-md-2">Hủy bỏ</a>
                                <button type="submit" class="btn btn-warning">Gửi yêu cầu bảo hành</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
