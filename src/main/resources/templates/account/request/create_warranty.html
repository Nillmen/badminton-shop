<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi yêu cầu bảo hành</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 80px;
        }

        .card {
            border: none;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
        }

        .image-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .image-preview img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #dee2e6;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-danger text-white py-3">
                        <h4 class="mb-0"><i class="fas fa-shield-alt me-2"></i>Gửi yêu cầu bảo hành</h4>
                    </div>
                    <div class="card-body p-4">
                        <!-- Alert messages -->
                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show"
                            role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form th:action="@{/account/requests/warranty}" th:object="${warrantyRequest}" method="post"
                            enctype="multipart/form-data">
                            <input type="hidden" th:field="*{orderItemId}">

                            <div class="mb-3">
                                <label class="form-label fw-bold">Vấn đề gặp phải <span
                                        class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{issueType}" required>
                                    <option value="" disabled selected>-- Chọn loại lỗi --</option>
                                    <option th:each="i : ${issueTypes}" th:value="${i}" th:text="${i.displayName}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Mô tả sự cố <span class="text-danger">*</span></label>
                                <textarea class="form-control" th:field="*{description}" rows="5" required
                                    placeholder="Mô tả chi tiết lỗi, hoàn cảnh xảy ra..."></textarea>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-camera me-1"></i>Hình ảnh bằng chứng
                                </label>
                                <input type="file" class="form-control" name="imageFiles" id="imageFiles"
                                    accept="image/*" multiple>
                                <div class="form-text">
                                    <i class="fas fa-info-circle me-1"></i>
                                    Chọn tối đa 5 ảnh (mỗi ảnh tối đa 5MB). Ảnh càng rõ càng giúp xử lý nhanh hơn.
                                </div>
                                <div id="imagePreview" class="image-preview"></div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/orders}" class="btn btn-secondary me-md-2">
                                    <i class="fas fa-times me-1"></i>Hủy bỏ
                                </a>
                                <button type="submit" class="btn btn-danger">
                                    <i class="fas fa-paper-plane me-1"></i>Gửi yêu cầu bảo hành
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Image preview functionality
        document.getElementById('imageFiles').addEventListener('change', function (e) {
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = '';

            const files = e.target.files;
            if (files.length > 5) {
                alert('Bạn chỉ có thể chọn tối đa 5 ảnh!');
                this.value = '';
                return;
            }

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (file.size > 5 * 1024 * 1024) {
                    alert('Ảnh "' + file.name + '" vượt quá 5MB!');
                    continue;
                }

                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.alt = 'Preview';
                    preview.appendChild(img);
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>

</html>
