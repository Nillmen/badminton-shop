<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Order Detail - Badminton Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 font-sans">

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="flex items-center mb-8">
            <a href="/orders" class="text-blue-600 hover:underline mr-4">&larr; Back to Orders</a>
            <h1 class="text-3xl font-bold text-gray-800">Order Detail</h1>
        </div>

        <div id="order-content" class="bg-white rounded-lg shadow overflow-hidden">
            <!-- Content loaded by JS -->
            <div class="p-8 text-center text-gray-500">Loading...</div>
        </div>

        <!-- Debug/Version Marker -->
        <div class="text-center text-gray-400 text-xs mt-4">v2.1 - Detail View</div>
    </div>

    <script>
        async function loadOrderDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('id');

            if (!orderId) {
                alert('Order ID required');
                return;
            }

            try {
                // Add timestamp to prevent caching
                const timestamp = new Date().getTime();
                const response = await fetch(`/api/orders/${orderId}?_t=${timestamp}`);

                if (!response.ok) throw new Error('Order not found');

                const order = await response.json();
                console.log("Order Data:", order); // Debug log
                renderOrder(order);
            } catch (error) {
                document.getElementById('order-content').innerHTML = `<div class="p-8 text-center text-red-500">${error.message}</div>`;
            }
        }

        function renderOrder(order) {
            const date = new Date(order.createdAt).toLocaleString();

            let itemsHtml = '';
            order.items.forEach(item => {
                itemsHtml += `
                    <div class="flex justify-between items-center border-b py-4 last:border-0">
                        <div>
                            <div class="font-bold text-gray-800">${item.productName}</div>
                            <div class="text-sm text-gray-500">
                                ${item.variantInfo} x ${item.quantity}
                            </div>
                        </div>
                        <div class="font-bold">$${item.totalPrice}</div>
                    </div>
                `;
            });

            const html = `
                <div class="p-6 border-b bg-gray-50 flex justify-between items-center">
                    <div>
                        <div class="text-sm text-gray-500">Order #</div>
                        <div class="font-bold text-lg">${order.orderNumber}</div>
                        <div class="mt-2">
                            <div class="text-xs text-gray-500 mb-1">Order Status</div>
                            <span class="px-3 py-1 rounded-full text-sm font-bold ${getStatusColor(order.status)}">
                                ${order.status}
                            </span>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-sm text-gray-500">Placed On</div>
                        <div class="font-semibold">${date}</div>
                    </div>
                </div>
                
                <div class="p-8">
                    <div class="grid grid-cols-2 gap-8 mb-8">
                        <div>
                            <h3 class="font-bold text-gray-700 mb-2">Shipping To</h3>
                            <p>${order.shippingRecipientName}</p>
                            <p>${order.shippingPhone}</p>
                            <p class="text-gray-600">${order.shippingAddress}</p>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-700 mb-2">Payment</h3>
                            <p class="mb-1">Method: <span class="font-semibold">${order.paymentMethod}</span></p>
                            <p>Payment Status: <span class="font-semibold ${order.paymentStatus === 'PAID' ? 'text-green-600' : 'text-yellow-600'}">${order.paymentStatus}</span></p>
                        </div>
                    </div>

                    <h3 class="font-bold text-gray-700 mb-4">Items</h3>
                    <div class="mb-8 border rounded-lg px-4">
                        ${itemsHtml}
                    </div>

                    <div class="flex justify-end">
                        <div class="w-1/2">
                            <div class="flex justify-between mb-2">
                                <span>Subtotal</span>
                                <span class="font-bold">$${order.subtotal}</span>
                            </div>
                             <div class="flex justify-between mb-2">
                                <span>Shipping</span>
                                <span class="font-bold">$${order.shippingFee}</span>
                            </div>
                            <hr class="my-2">
                            <div class="flex justify-between text-xl font-bold text-blue-600">
                                <span>Total</span>
                                <span>$${order.totalAmount}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('order-content').innerHTML = html;
        }

        function getStatusColor(status) {
            // Updated to match history.html exactly
            switch (status) {
                case 'PENDING': return 'bg-yellow-100 text-yellow-800';
                case 'CONFIRMED': return 'bg-blue-100 text-blue-800';
                case 'PROCESSING': return 'bg-blue-100 text-blue-800';
                case 'STRINGING': return 'bg-purple-100 text-purple-800';
                case 'READY_TO_SHIP': return 'bg-indigo-100 text-indigo-800';
                case 'SHIPPED': return 'bg-indigo-100 text-indigo-800';
                case 'DELIVERED': return 'bg-green-100 text-green-800';
                case 'COMPLETED': return 'bg-green-100 text-green-800';
                case 'CANCELLED': return 'bg-red-100 text-red-800';
                case 'REFUNDED': return 'bg-gray-100 text-gray-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        loadOrderDetail();
    </script>
</body>

</html>
