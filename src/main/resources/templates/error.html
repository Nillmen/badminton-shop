<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">

<head>
    <title>Error</title>
</head>

<body>
    <div layout:fragment="content" class="text-center py-5">
        <div class="display-1 text-danger mb-4">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h1 class="mb-4">Something went wrong</h1>
        <p class="lead text-muted mb-4">We encountered an unexpected error. Please try again later or contact support.
        </p>

        <div class="alert alert-secondary d-inline-block text-start" th:if="${message}">
            <strong>Error Details:</strong> <span th:text="${message}">Error message</span>
        </div> else
        <div class="alert alert-secondary d-inline-block text-start" th:if="${exception}">
            <strong>Exception:</strong> <span th:text="${exception}">Exception message</span>
        </div>

        <div class="mt-4">
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home"></i> Back to Home
            </a>
        </div>
    </div>
</body>

</html>
