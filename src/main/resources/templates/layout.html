<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Badminton Shop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
        }

        main {
            flex: 1;
        }

        .navbar-brand {
            font-weight: bold;
            color: #0d6efd !important;
        }

        .footer {
            background: #343a40;
            color: white;
            padding: 2rem 0;
            margin-top: auto;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-shuttlecock"></i> Badminton Shop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
                    <li class="nav-item">
                        <a class="nav-link position-relative" href="/cart">
                            <i class="fas fa-shopping-cart"></i> Cart
                            <span id="cart-badge"
                                class="position-absolute top-10 start-100 translate-middle badge rounded-pill bg-danger"
                                style="display:none;">0</span>
                        </a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="/orders"><i class="fas fa-history"></i> My Orders</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">
        <div layout:fragment="content">
            <!-- Content goes here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer text-center">
        <div class="container">
            <p>&copy; 2024 Badminton Shop. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Global Cart Script -->
    <script>
        // Generate or Retrieve Session ID
        function getSessionId() {
            let sessionId = localStorage.getItem('badminton_session_id');
            if (!sessionId) {
                sessionId = 'sess_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
                localStorage.setItem('badminton_session_id', sessionId);
            }
            return sessionId;
        }

        // Get User ID (if logged in - implement if Auth available)
        // For now preventing null being passed as string "null"
        function getUserId() {
            return null; // Update this if Member 1 Auth is fully ready
        }

        // Update Cart Count
        function updateCartBadge() {
            const sid = getSessionId();
            fetch(`/api/cart/count?sessionId=${sid}`)
                .then(res => res.json())
                .then(count => {
                    const badge = document.getElementById('cart-badge');
                    if (count > 0) {
                        badge.innerText = count;
                        badge.style.display = 'block';
                    } else {
                        badge.style.display = 'none';
                    }
                })
                .catch(err => console.error(err));
        }
        document.addEventListener("DOMContentLoaded", updateCartBadge);
    </script>

    <th:block layout:fragment="scripts"></th:block>
</body>

</html>
