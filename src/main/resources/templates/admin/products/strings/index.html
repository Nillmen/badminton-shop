<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/admin}">

<head>
    <title>Quản lý Cước Vợt</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0 text-gray-800">Quản lý Cước Vợt</h1>
            <div>
                <a th:href="@{/admin/products}" class="btn btn-outline-secondary me-2">
                    <i class="fas fa-arrow-left"></i> Quay lại sản phẩm
                </a>
                <a th:href="@{/admin/products/strings/new}" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Thêm Cước Mới
                </a>
            </div>
        </div>

        <!-- Alert Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Danh sách Cước</h6>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tên</th>
                                <th>SKU</th>
                                <th>Thương hiệu</th>
                                <th>Loại</th>
                                <th>Giá bán</th>
                                <th>Tồn kho</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${strings}">
                                <td th:text="${item.stringId}">1</td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <img th:if="${item.imageUrl}" th:src="${item.imageUrl}" class="rounded me-2"
                                            width="40" height="40" style="object-fit: cover;">
                                        <span th:text="${item.name}">Yonex BG 65</span>
                                    </div>
                                </td>
                                <td th:text="${item.sku}">BG65</td>
                                <td th:text="${item.brandName}">Yonex</td>
                                <td th:text="${item.stringType}">SYNTHETIC</td>
                                <td
                                    th:text="${#numbers.formatDecimal(item.retailPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                    120,000 đ</td>
                                <td th:text="${item.quantityInStock}">100</td>
                                <td>
                                    <span th:if="${item.isActive}" class="badge bg-success">Active</span>
                                    <span th:unless="${item.isActive}" class="badge bg-secondary">Inactive</span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/products/strings/{id}/edit(id=${item.stringId})}"
                                        class="btn btn-sm btn-info">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <form th:action="@{/admin/products/strings/{id}/delete(id=${item.stringId})}"
                                        method="post" class="d-inline"
                                        onsubmit="return confirm('Bạn có chắc chắn muốn xóa cước này?');">
                                        <button type="submit" class="btn btn-sm btn-danger">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
