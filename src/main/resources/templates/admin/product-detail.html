<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/admin}">

<head>
    <title>Chi tiết sản phẩm</title>
    <style>
        .image-card {
            position: relative;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 5px;
            margin: 5px;
            display: inline-block;
        }

        .image-card.primary {
            border-color: #28a745;
        }

        .image-card img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
        }

        .image-card .actions {
            position: absolute;
            top: 5px;
            right: 5px;
            display: flex;
            gap: 3px;
        }

        .image-card .actions button {
            padding: 2px 6px;
            font-size: 0.7rem;
        }

        .upload-zone {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-zone:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .nav-tabs .nav-link {
            font-weight: 500;
        }

        .variant-row {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

        /* Drag and Drop Styles */
        .image-card {
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .image-card:active {
            cursor: grabbing;
        }

        .image-card.dragging {
            opacity: 0.5;
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .image-card.drag-over {
            border-color: #667eea;
            background: #f0f4ff;
        }

        #imagesGrid {
            min-height: 150px;
        }

        .reorder-hint {
            font-size: 0.85rem;
            color: #6c757d;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        <!-- Page Header -->
        <div class="page-header d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="page-title" id="pageTitle">Chi tiết sản phẩm</h1>
                <p class="page-subtitle" id="pageSubtitle">Chỉnh sửa thông tin sản phẩm</p>
            </div>
            <div>
                <a th:href="@{/admin/products}" class="btn btn-outline-secondary me-2">
                    <i class="fas fa-arrow-left me-1"></i>Quay lại
                </a>
                <button class="btn btn-primary" onclick="saveProduct()">
                    <i class="fas fa-save me-1"></i>Lưu sản phẩm
                </button>
            </div>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs mb-4" id="productTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="info-tab" data-bs-toggle="tab" data-bs-target="#info-content"
                    type="button">
                    <i class="fas fa-info-circle me-1"></i>Thông tin
                </button>
            </li>
            <li class="nav-item" role="presentation" th:if="${productId != null}">
                <button class="nav-link" id="images-tab" data-bs-toggle="tab" data-bs-target="#images-content"
                    type="button">
                    <i class="fas fa-images me-1"></i>Hình ảnh
                </button>
            </li>
            <li class="nav-item" role="presentation" th:if="${productId != null}">
                <button class="nav-link" id="variants-tab" data-bs-toggle="tab" data-bs-target="#variants-content"
                    type="button">
                    <i class="fas fa-layer-group me-1"></i>Biến thể
                </button>
            </li>
            <li class="nav-item" role="presentation" th:if="${productId != null}">
                <button class="nav-link" id="suppliers-tab" data-bs-toggle="tab" data-bs-target="#suppliers-content"
                    type="button">
                    <i class="fas fa-truck me-1"></i>Nhà cung cấp
                </button>
            </li>
        </ul>

        <div class="tab-content" id="productTabContent">
            <!-- Info Tab -->
            <div class="tab-pane fade show active" id="info-content" role="tabpanel">
                <div class="card">
                    <div class="card-body">
                        <form id="productForm">
                            <div class="row">
                                <div class="col-md-8 mb-3">
                                    <label class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="productName" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">SKU <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="productSku" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Danh mục</label>
                                    <select class="form-select" id="categoryId">
                                        <option value="">-- Chọn danh mục --</option>
                                        <th:block th:each="cat : ${categories}">
                                            <option th:value="${cat.categoryId}" th:text="${cat.name}"></option>
                                            <!-- Show child categories (subcategories) -->
                                            <th:block th:if="${cat.children != null and !#lists.isEmpty(cat.children)}">
                                                <option th:each="sub : ${cat.children}" th:value="${sub.categoryId}"
                                                    th:text="'— ' + ${sub.name}"></option>
                                            </th:block>
                                        </th:block>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Thương hiệu</label>
                                    <select class="form-select" id="brandId">
                                        <option value="">-- Chọn thương hiệu --</option>
                                        <option th:each="brand : ${brands}" th:value="${brand.brandId}"
                                            th:text="${brand.name}"></option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Loại sản phẩm</label>
                                    <select class="form-select" id="productType">
                                        <option value="RACKET">Vợt cầu lông</option>
                                        <option value="SHOES">Giày</option>
                                        <option value="APPAREL">Quần áo</option>
                                        <option value="ACCESSORY">Phụ kiện</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">Giá gốc</label>
                                    <input type="number" class="form-control" id="originalPrice" min="0">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">Giá bán <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="sellingPrice" min="0" required>
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">Trạng thái</label>
                                    <select class="form-select" id="status">
                                        <option value="ACTIVE">Đang bán</option>
                                        <option value="INACTIVE">Tạm ngừng</option>
                                        <option value="OUT_OF_STOCK">Hết hàng</option>
                                    </select>
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">Xuất bản</label>
                                    <select class="form-select" id="isPublished">
                                        <option value="true">Hiển thị</option>
                                        <option value="false">Ẩn</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Mô tả ngắn</label>
                                <textarea class="form-control" id="shortDescription" rows="2"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Mô tả chi tiết</label>
                                <textarea class="form-control" id="description" rows="5"></textarea>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Images Tab -->
            <div class="tab-pane fade" id="images-content" role="tabpanel">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-0">Quản lý hình ảnh</h5>
                            <small class="reorder-hint"><i class="fas fa-arrows-alt me-1"></i>Kéo thả để sắp xếp thứ tự
                                hình ảnh</small>
                        </div>
                        <span class="badge bg-info" id="imageCount">0 hình</span>
                    </div>
                    <div class="card-body">
                        <!-- Upload Zone -->
                        <div class="upload-zone mb-4" onclick="document.getElementById('imageUpload').click()">
                            <i class="fas fa-cloud-upload-alt fa-2x text-muted mb-2"></i>
                            <p class="mb-0">Click để upload hình ảnh</p>
                            <small class="text-muted">Hỗ trợ JPG, PNG (max 5MB)</small>
                            <input type="file" id="imageUpload" accept="image/*" style="display:none"
                                onchange="uploadImage(this)">
                        </div>

                        <!-- Image URL -->
                        <div class="input-group mb-4">
                            <input type="text" class="form-control" id="imageUrl"
                                placeholder="Hoặc nhập URL hình ảnh...">
                            <button class="btn btn-outline-primary" onclick="addImageByUrl()">
                                <i class="fas fa-link me-1"></i>Thêm URL
                            </button>
                        </div>

                        <!-- Images Grid -->
                        <div id="imagesGrid" class="d-flex flex-wrap">
                            <div class="text-center text-muted py-4 w-100">Chưa có hình ảnh</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Variants Tab -->
            <div class="tab-pane fade" id="variants-content" role="tabpanel">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Quản lý biến thể</h5>
                        <button class="btn btn-sm btn-primary" onclick="openVariantModal()">
                            <i class="fas fa-plus me-1"></i>Thêm biến thể
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="variantsList">
                            <div class="text-center text-muted py-4">Chưa có biến thể</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Suppliers Tab -->
            <div class="tab-pane fade" id="suppliers-content" role="tabpanel">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Quản lý nhà cung cấp</h5>
                        <button class="btn btn-sm btn-primary" data-bs-toggle="modal"
                            data-bs-target="#addSupplierModal">
                            <i class="fas fa-plus me-1"></i>Thêm NCC
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="suppliersList">
                            <div class="text-center text-muted py-4">Chưa có nhà cung cấp nào</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Variant Modal -->
        <div class="modal fade" id="variantModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="variantModalTitle">Thêm biến thể</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="variantId">
                        <div class="mb-3">
                            <label class="form-label">Tên biến thể <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="variantName"
                                placeholder="VD: Màu đỏ, Size L...">
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">SKU biến thể</label>
                                <input type="text" class="form-control" id="variantSku">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Chênh lệch giá</label>
                                <input type="number" class="form-control" id="variantPriceAdjust" value="0">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Màu sắc</label>
                                <input type="text" class="form-control" id="variantColor">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Kích cỡ</label>
                                <input type="text" class="form-control" id="variantSize">
                            </div>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="variantActive" checked>
                            <label class="form-check-label" for="variantActive">Đang bán</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-primary" onclick="saveVariant()">Lưu</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Supplier Modal -->
        <div class="modal fade" id="addSupplierModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Thêm nhà cung cấp</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Chọn nhà cung cấp <span class="text-danger">*</span></label>
                            <select class="form-select" id="supplierSelect">
                                <option value="">-- Chọn nhà cung cấp --</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Giá nhập</label>
                            <input type="number" class="form-control" id="supplierCostPrice" min="0"
                                placeholder="Giá nhập từ NCC">
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="isPrimarySupplier">
                            <label class="form-check-label" for="isPrimarySupplier">Nhà cung cấp chính</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-primary" onclick="addSupplier()">Thêm</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            const productId = /*[[${productId}]]*/ null;
            const isNewProduct = !productId;
            let variantModal = null;

            document.addEventListener('DOMContentLoaded', function () {
                variantModal = new bootstrap.Modal(document.getElementById('variantModal'));

                if (isNewProduct) {
                    document.getElementById('pageTitle').textContent = 'Thêm sản phẩm mới';
                    document.getElementById('pageSubtitle').textContent = 'Tạo sản phẩm mới';
                } else {
                    loadProduct();
                    loadProductSuppliers();
                    loadAvailableSuppliers();
                    loadImages();
                    loadVariants();
                }
            });

            // ===== PRODUCT CRUD =====
            async function loadProduct() {
                try {
                    const response = await fetch('/admin/api/products/' + productId);
                    if (response.ok) {
                        const product = await response.json();
                        document.getElementById('productName').value = product.name || '';
                        document.getElementById('productSku').value = product.sku || '';
                        document.getElementById('categoryId').value = product.categoryId || '';
                        document.getElementById('brandId').value = product.brandId || '';
                        document.getElementById('productType').value = product.productType || 'RACKET';
                        document.getElementById('originalPrice').value = product.compareAtPrice || '';
                        document.getElementById('sellingPrice').value = product.basePrice || '';
                        document.getElementById('status').value = product.status || 'ACTIVE';
                        document.getElementById('isPublished').value = product.status === 'ACTIVE' ? 'true' : 'false';
                        document.getElementById('shortDescription').value = product.shortDescription || '';
                        document.getElementById('description').value = product.fullDescription || '';
                    }
                } catch (error) {
                    console.error('Error loading product:', error);
                }
            }

            async function saveProduct() {
                const categoryId = document.getElementById('categoryId').value;
                const basePrice = document.getElementById('sellingPrice').value;
                const statusVal = document.getElementById('status').value;
                const productTypeVal = document.getElementById('productType').value;

                const data = {
                    name: document.getElementById('productName').value,
                    sku: document.getElementById('productSku').value,
                    categoryId: categoryId ? parseInt(categoryId) : null,
                    brandId: document.getElementById('brandId').value ? parseInt(document.getElementById('brandId').value) : null,
                    productType: productTypeVal || null,
                    compareAtPrice: document.getElementById('originalPrice').value ? parseFloat(document.getElementById('originalPrice').value) : null,
                    basePrice: basePrice ? parseFloat(basePrice) : null,
                    status: statusVal || null,
                    shortDescription: document.getElementById('shortDescription').value || null,
                    fullDescription: document.getElementById('description').value || null
                };

                if (!data.name || !data.sku || !data.basePrice) {
                    alert('Vui lòng điền các trường bắt buộc (Tên, SKU, Giá bán)');
                    return;
                }

                if (!data.categoryId) {
                    alert('Vui lòng chọn danh mục');
                    return;
                }

                try {
                    const url = isNewProduct ? '/admin/api/products' : '/admin/api/products/' + productId;
                    const method = isNewProduct ? 'POST' : 'PUT';

                    const response = await fetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();
                    if (result.error) {
                        alert('Lỗi: ' + result.error);
                    } else {
                        alert('Đã lưu sản phẩm!');
                        if (isNewProduct && result.productId) {
                            window.location.href = '/admin/products/' + result.productId;
                        }
                    }
                } catch (error) {
                    alert('Lỗi: ' + error.message);
                }
            }

            // ===== IMAGES =====
            async function loadImages() {
                try {
                    const response = await fetch('/admin/api/products/' + productId + '/images');
                    const images = await response.json();
                    renderImages(images);
                } catch (error) {
                    console.error('Error loading images:', error);
                }
            }

            function renderImages(images) {
                const grid = document.getElementById('imagesGrid');
                document.getElementById('imageCount').textContent = images.length + ' hình';

                if (images.length === 0) {
                    grid.innerHTML = '<div class="text-center text-muted py-4 w-100">Chưa có hình ảnh</div>';
                    return;
                }

                grid.innerHTML = images.map(img => `
                    <div class="image-card ${img.isPrimary ? 'primary' : ''}" data-id="${img.imageId}">
                        <img src="${img.imageUrl}" alt="${img.altText || ''}">
                        <div class="actions">
                            ${!img.isPrimary ? `<button class="btn btn-sm btn-success" onclick="setPrimary(${img.imageId})" title="Đặt làm ảnh chính"><i class="fas fa-star"></i></button>` : ''}
                            <button class="btn btn-sm btn-danger" onclick="deleteImage(${img.imageId})" title="Xóa"><i class="fas fa-trash"></i></button>
                        </div>
                        ${img.isPrimary ? '<span class="badge bg-success position-absolute bottom-0 start-0 m-1">Chính</span>' : ''}
                    </div>
                `).join('');

                // Initialize drag and drop after rendering
                initDragAndDrop();
            }

            async function uploadImage(input) {
                if (!input.files || !input.files[0]) return;

                const formData = new FormData();
                formData.append('file', input.files[0]);

                try {
                    const response = await fetch('/admin/api/products/' + productId + '/images', {
                        method: 'POST',
                        body: formData
                    });
                    const result = await response.json();
                    if (result.error) {
                        alert('Lỗi: ' + result.error);
                    } else {
                        loadImages();
                    }
                } catch (error) {
                    alert('Lỗi upload: ' + error.message);
                }
                input.value = '';
            }

            async function addImageByUrl() {
                const url = document.getElementById('imageUrl').value.trim();
                if (!url) return;

                try {
                    const response = await fetch('/admin/api/products/' + productId + '/images/url?imageUrl=' + encodeURIComponent(url), {
                        method: 'POST'
                    });
                    const result = await response.json();
                    if (result.error) {
                        alert('Lỗi: ' + result.error);
                    } else {
                        document.getElementById('imageUrl').value = '';
                        loadImages();
                    }
                } catch (error) {
                    alert('Lỗi: ' + error.message);
                }
            }

            async function setPrimary(imageId) {
                try {
                    const response = await fetch('/admin/api/products/' + productId + '/images/' + imageId + '/primary', {
                        method: 'PUT'
                    });
                    const result = await response.json();
                    if (result.error) {
                        alert('Lỗi: ' + result.error);
                    } else {
                        loadImages();
                    }
                } catch (error) {
                    alert('Lỗi: ' + error.message);
                }
            }

            async function deleteImage(imageId) {
                if (!confirm('Xóa hình ảnh này?')) return;

                try {
                    const response = await fetch('/admin/api/products/' + productId + '/images/' + imageId, {
                        method: 'DELETE'
                    });
                    const result = await response.json();
                    if (result.error) {
                        alert('Lỗi: ' + result.error);
                    } else {
                        loadImages();
                    }
                } catch (error) {
                    alert('Lỗi: ' + error.message);
                }
            }

            // ===== DRAG AND DROP REORDER =====
            function initDragAndDrop() {
                const grid = document.getElementById('imagesGrid');
                const cards = grid.querySelectorAll('.image-card');

                cards.forEach(card => {
                    card.setAttribute('draggable', 'true');

                    card.addEventListener('dragstart', handleDragStart);
                    card.addEventListener('dragend', handleDragEnd);
                    card.addEventListener('dragover', handleDragOver);
                    card.addEventListener('dragenter', handleDragEnter);
                    card.addEventListener('dragleave', handleDragLeave);
                    card.addEventListener('drop', handleDrop);
                });
            }

            let draggedElement = null;

            function handleDragStart(e) {
                draggedElement = this;
                this.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', this.dataset.id);
            }

            function handleDragEnd(e) {
                this.classList.remove('dragging');
                document.querySelectorAll('.image-card').forEach(card => {
                    card.classList.remove('drag-over');
                });
            }

            function handleDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            }

            function handleDragEnter(e) {
                e.preventDefault();
                if (this !== draggedElement) {
                    this.classList.add('drag-over');
                }
            }

            function handleDragLeave(e) {
                this.classList.remove('drag-over');
            }

            function handleDrop(e) {
                e.preventDefault();
                this.classList.remove('drag-over');

                if (this !== draggedElement) {
                    const grid = document.getElementById('imagesGrid');
                    const allCards = [...grid.querySelectorAll('.image-card')];
                    const draggedIndex = allCards.indexOf(draggedElement);
                    const targetIndex = allCards.indexOf(this);

                    if (draggedIndex < targetIndex) {
                        this.parentNode.insertBefore(draggedElement, this.nextSibling);
                    } else {
                        this.parentNode.insertBefore(draggedElement, this);
                    }

                    // Save new order to server
                    saveImageOrder();
                }
            }

            async function saveImageOrder() {
                const grid = document.getElementById('imagesGrid');
                const cards = grid.querySelectorAll('.image-card');
                const imageIds = [...cards].map(card => parseInt(card.dataset.id));

                try {
                    const response = await fetch('/admin/api/products/' + productId + '/images/reorder', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(imageIds)
                    });
                    const result = await response.json();
                    if (result.error) {
                        alert('Lỗi sắp xếp: ' + result.error);
                        loadImages(); // Reload to restore order
                    }
                } catch (error) {
                    alert('Lỗi: ' + error.message);
                    loadImages(); // Reload to restore order
                }
            }

            // ===== VARIANTS =====
            async function loadVariants() {
                try {
                    const response = await fetch('/admin/api/products/' + productId + '/variants');
                    const variants = await response.json();
                    renderVariants(variants);
                } catch (error) {
                    console.error('Error loading variants:', error);
                }
            }

            function renderVariants(variants) {
                const list = document.getElementById('variantsList');

                if (variants.length === 0) {
                    list.innerHTML = '<div class="text-center text-muted py-4">Chưa có biến thể</div>';
                    return;
                }

                list.innerHTML = variants.map(v => `
                    <div class="variant-row d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${v.variantName}</strong>
                            <span class="badge ${v.isActive ? 'bg-success' : 'bg-secondary'} ms-2">${v.isActive ? 'Đang bán' : 'Tạm ngừng'}</span>
                            <div class="small text-muted mt-1">
                                SKU: ${v.sku || '-'} | 
                                ${v.color ? 'Màu: ' + v.color + ' | ' : ''}
                                ${v.size ? 'Size: ' + v.size + ' | ' : ''}
                                Giá: ${v.priceAdjustment ? (v.priceAdjustment > 0 ? '+' : '') + v.priceAdjustment.toLocaleString() + 'đ' : 'Giữ nguyên'}
                            </div>
                        </div>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-primary" onclick="editVariant(${v.variantId})"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-outline-danger" onclick="deleteVariant(${v.variantId})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `).join('');
            }

            function openVariantModal() {
                document.getElementById('variantModalTitle').textContent = 'Thêm biến thể';
                document.getElementById('variantId').value = '';
                document.getElementById('variantName').value = '';
                document.getElementById('variantSku').value = '';
                document.getElementById('variantPriceAdjust').value = '0';
                document.getElementById('variantColor').value = '';
                document.getElementById('variantSize').value = '';
                document.getElementById('variantActive').checked = true;
                variantModal.show();
            }

            async function editVariant(variantId) {
                try {
                    const response = await fetch('/admin/api/products/' + productId + '/variants');
                    const variants = await response.json();
                    const v = variants.find(x => x.variantId === variantId);
                    if (v) {
                        document.getElementById('variantModalTitle').textContent = 'Sửa biến thể';
                        document.getElementById('variantId').value = v.variantId;
                        document.getElementById('variantName').value = v.variantName || '';
                        document.getElementById('variantSku').value = v.sku || '';
                        document.getElementById('variantPriceAdjust').value = v.priceAdjustment || 0;
                        document.getElementById('variantColor').value = v.color || '';
                        document.getElementById('variantSize').value = v.size || '';
                        document.getElementById('variantActive').checked = v.isActive === true;
                        variantModal.show();
                    }
                } catch (error) {
                    alert('Lỗi: ' + error.message);
                }
            }

            async function saveVariant() {
                const variantId = document.getElementById('variantId').value;
                const data = {
                    variantName: document.getElementById('variantName').value,
                    sku: document.getElementById('variantSku').value || null,
                    priceAdjustment: parseInt(document.getElementById('variantPriceAdjust').value) || 0,
                    color: document.getElementById('variantColor').value || null,
                    size: document.getElementById('variantSize').value || null,
                    isActive: document.getElementById('variantActive').checked
                };

                if (!data.variantName) {
                    alert('Vui lòng nhập tên biến thể');
                    return;
                }

                try {
                    const url = variantId
                        ? '/admin/api/products/' + productId + '/variants/' + variantId
                        : '/admin/api/products/' + productId + '/variants';
                    const method = variantId ? 'PUT' : 'POST';

                    const response = await fetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();
                    if (result.error) {
                        alert('Lỗi: ' + result.error);
                    } else {
                        variantModal.hide();
                        loadVariants();
                    }
                } catch (error) {
                    alert('Lỗi: ' + error.message);
                }
            }

            async function deleteVariant(variantId) {
                if (!confirm('Xóa biến thể này?')) return;

                try {
                    const response = await fetch('/admin/api/products/' + productId + '/variants/' + variantId, {
                        method: 'DELETE'
                    });
                    const result = await response.json();
                    if (result.error) {
                        alert('Lỗi: ' + result.error);
                    } else {
                        loadVariants();
                    }
                } catch (error) {
                    alert('Lỗi: ' + error.message);
                }
            }

            // ===== SUPPLIERS =====
            async function loadProductSuppliers() {
                try {
                    const response = await fetch('/admin/api/products/' + productId + '/suppliers');
                    const suppliers = await response.json();
                    renderProductSuppliers(suppliers);
                } catch (error) {
                    console.error('Error loading suppliers:', error);
                }
            }

            async function loadAvailableSuppliers() {
                try {
                    const response = await fetch('/admin/api/suppliers/active');
                    const suppliers = await response.json();
                    const select = document.getElementById('supplierSelect');
                    select.innerHTML = '<option value="">-- Chọn nhà cung cấp --</option>';
                    suppliers.forEach(s => {
                        select.innerHTML += `<option value="${s.supplierId}">${s.name} ${s.code ? '(' + s.code + ')' : ''}</option>`;
                    });
                } catch (error) {
                    console.error('Error loading available suppliers:', error);
                }
            }

            function renderProductSuppliers(suppliers) {
                const list = document.getElementById('suppliersList');

                if (!suppliers || suppliers.length === 0) {
                    list.innerHTML = '<div class="text-center text-muted py-4">Chưa có nhà cung cấp nào</div>';
                    return;
                }

                list.innerHTML = suppliers.map(s => `
                    <div class="variant-row d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${s.supplierName || 'NCC #' + s.supplierId}</strong>
                            ${s.isPrimary ? '<span class="badge bg-primary ms-2">Chính</span>' : ''}
                            <div class="small text-muted mt-1">
                                ${s.supplierCode ? 'Mã: ' + s.supplierCode + ' | ' : ''}
                                ${s.costPrice ? 'Giá nhập: ' + s.costPrice.toLocaleString() + 'đ' : 'Chưa có giá nhập'}
                            </div>
                        </div>
                        <div class="btn-group btn-group-sm">
                            ${!s.isPrimary ? `<button class="btn btn-outline-success" onclick="setPrimarySupplier(${s.supplierId})" title="Đặt làm NCC chính"><i class="fas fa-star"></i></button>` : ''}
                            <button class="btn btn-outline-danger" onclick="removeSupplier(${s.supplierId})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `).join('');
            }

            async function addSupplier() {
                const supplierId = document.getElementById('supplierSelect').value;
                const costPrice = document.getElementById('supplierCostPrice').value;
                const isPrimary = document.getElementById('isPrimarySupplier').checked;

                if (!supplierId) {
                    alert('Vui lòng chọn nhà cung cấp');
                    return;
                }

                try {
                    // Use query params instead of JSON body (API expects @RequestParam)
                    const url = new URL('/admin/api/products/' + productId + '/suppliers', window.location.origin);
                    url.searchParams.append('supplierId', supplierId);
                    url.searchParams.append('isPrimary', isPrimary);

                    const response = await fetch(url, {
                        method: 'POST'
                    });

                    const result = await response.json();
                    if (result.error) {
                        alert('Lỗi: ' + result.error);
                    } else {
                        bootstrap.Modal.getInstance(document.getElementById('addSupplierModal')).hide();
                        document.getElementById('supplierSelect').value = '';
                        document.getElementById('supplierCostPrice').value = '';
                        document.getElementById('isPrimarySupplier').checked = false;
                        loadProductSuppliers();
                    }
                } catch (error) {
                    alert('Lỗi: ' + error.message);
                }
            }

            async function removeSupplier(supplierId) {
                if (!confirm('Xóa nhà cung cấp này khỏi sản phẩm?')) return;

                try {
                    const response = await fetch('/admin/api/products/' + productId + '/suppliers/' + supplierId, {
                        method: 'DELETE'
                    });
                    const result = await response.json();
                    if (result.error) {
                        alert('Lỗi: ' + result.error);
                    } else {
                        loadProductSuppliers();
                    }
                } catch (error) {
                    alert('Lỗi: ' + error.message);
                }
            }

            async function setPrimarySupplier(supplierId) {
                try {
                    const url = new URL('/admin/api/products/' + productId + '/suppliers', window.location.origin);
                    url.searchParams.append('supplierId', supplierId);
                    url.searchParams.append('isPrimary', true);

                    const response = await fetch(url, {
                        method: 'POST'
                    });

                    const result = await response.json();
                    if (result.error) {
                        alert('Lỗi: ' + result.error);
                    } else {
                        loadProductSuppliers();
                    }
                } catch (error) {
                    alert('Lỗi: ' + error.message);
                }
            }
        </script>
    </th:block>
</body>

</html>
