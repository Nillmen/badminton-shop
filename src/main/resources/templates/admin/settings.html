<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/admin}">

<head>
    <title>Cài đặt hệ thống</title>
    <style>
        .setting-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .setting-group-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-label {
            font-weight: 500;
            color: #333;
        }

        .setting-description {
            font-size: 0.85rem;
            color: #666;
        }

        .setting-input {
            width: 250px;
        }

        .save-btn-container {
            position: sticky;
            bottom: 0;
            background: linear-gradient(transparent, white 30%);
            padding: 1.5rem 0;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        <!-- Page Header -->
        <div class="page-header d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="page-title">Cài đặt hệ thống</h1>
                <p class="page-subtitle">Quản lý các cấu hình của shop</p>
            </div>
            <div>
                <button class="btn btn-primary" id="saveAllBtn" onclick="saveSettings()">
                    <i class="fas fa-save me-2"></i>Lưu tất cả
                </button>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Đang tải...</span>
            </div>
        </div>

        <!-- Settings Container -->
        <div id="settingsContainer" style="display: none;">
            <!-- General Settings -->
            <div class="setting-card">
                <h5 class="setting-group-title">
                    <i class="fas fa-store me-2"></i>Thông tin cửa hàng
                </h5>
                <div id="generalSettings"></div>
            </div>

            <!-- Contact Settings -->
            <div class="setting-card">
                <h5 class="setting-group-title">
                    <i class="fas fa-phone me-2"></i>Thông tin liên hệ
                </h5>
                <div id="contactSettings"></div>
            </div>

            <!-- Business Settings -->
            <div class="setting-card">
                <h5 class="setting-group-title">
                    <i class="fas fa-cog me-2"></i>Cấu hình kinh doanh
                </h5>
                <div id="businessSettings"></div>
            </div>
        </div>

        <!-- Save Button -->
        <div class="save-btn-container text-end" id="saveContainer" style="display: none;">
            <button class="btn btn-lg btn-primary" onclick="saveSettings()">
                <i class="fas fa-save me-2"></i>Lưu thay đổi
            </button>
        </div>
    </div>

    <div layout:fragment="scripts">
        <script>
            let settingsData = [];

            // Group settings by category
            const settingGroups = {
                general: ['site_name', 'site_description', 'site_logo'],
                contact: ['contact_phone', 'contact_email', 'contact_address', 'business_hours', 'facebook_url', 'instagram_url', 'youtube_url', 'tiktok_url'],
                business: ['free_shipping_threshold', 'default_shipping_fee']
            };

            // Labels for settings
            const settingLabels = {
                'site_name': 'Tên website',
                'site_description': 'Mô tả website',
                'site_logo': 'Logo URL',
                'contact_phone': 'Số điện thoại',
                'contact_email': 'Email liên hệ',
                'contact_address': 'Địa chỉ',
                'business_hours': 'Giờ làm việc',
                'facebook_url': 'Link Facebook',
                'instagram_url': 'Link Instagram',
                'youtube_url': 'Link YouTube',
                'tiktok_url': 'Link TikTok',
                'free_shipping_threshold': 'Miễn phí ship từ (VNĐ)',
                'default_shipping_fee': 'Phí ship mặc định (VNĐ)'
            };

            document.addEventListener('DOMContentLoaded', function () {
                loadSettings();
            });

            async function loadSettings() {
                try {
                    const response = await fetch('/admin/api/settings');
                    const result = await response.json();

                    if (result.success) {
                        settingsData = result.data || [];
                        renderSettings();
                    } else {
                        showError('Không thể tải cài đặt');
                    }
                } catch (error) {
                    console.error('Error loading settings:', error);
                    showError('Lỗi kết nối server');
                } finally {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('settingsContainer').style.display = 'block';
                    document.getElementById('saveContainer').style.display = 'block';
                }
            }

            function renderSettings() {
                const generalContainer = document.getElementById('generalSettings');
                const contactContainer = document.getElementById('contactSettings');
                const businessContainer = document.getElementById('businessSettings');

                // Clear containers
                generalContainer.innerHTML = '';
                contactContainer.innerHTML = '';
                businessContainer.innerHTML = '';

                settingsData.forEach(setting => {
                    const html = createSettingItem(setting);

                    if (settingGroups.general.includes(setting.settingKey)) {
                        generalContainer.innerHTML += html;
                    } else if (settingGroups.contact.includes(setting.settingKey)) {
                        contactContainer.innerHTML += html;
                    } else {
                        businessContainer.innerHTML += html;
                    }
                });
            }

            function createSettingItem(setting) {
                const label = settingLabels[setting.settingKey] || setting.settingKey;
                const isNumber = ['free_shipping_threshold', 'default_shipping_fee'].includes(setting.settingKey);

                return `
                    <div class="setting-item">
                        <div>
                            <div class="setting-label">${label}</div>
                            <div class="setting-description">${setting.description || ''}</div>
                        </div>
                        <input type="${isNumber ? 'number' : 'text'}" 
                               class="form-control setting-input" 
                               id="setting_${setting.settingKey}"
                               data-key="${setting.settingKey}"
                               value="${setting.settingValue || ''}"
                               placeholder="${label}">
                    </div>
                `;
            }

            async function saveSettings() {
                const saveBtn = document.getElementById('saveAllBtn');
                saveBtn.disabled = true;
                saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Đang lưu...';

                try {
                    const inputs = document.querySelectorAll('.setting-input');
                    const settings = {};

                    inputs.forEach(input => {
                        settings[input.dataset.key] = input.value;
                    });

                    const response = await fetch('/admin/api/settings', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ settings: settings })
                    });

                    const result = await response.json();

                    if (result.success) {
                        showSuccess('Đã lưu cài đặt thành công!');
                    } else {
                        showError(result.message || 'Lỗi khi lưu cài đặt');
                    }
                } catch (error) {
                    console.error('Error saving settings:', error);
                    showError('Lỗi kết nối server');
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = '<i class="fas fa-save me-2"></i>Lưu tất cả';
                }
            }

            function showSuccess(message) {
                // Using Bootstrap toast or alert
                alert(message); // Replace with better UI notification
            }

            function showError(message) {
                alert('Lỗi: ' + message); // Replace with better UI notification
            }
        </script>
    </div>
</body>

</html>
