<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">

<head>
    <title>Admin - Order Management</title>
</head>

<body>

    <div layout:fragment="content">
        <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Order Management</h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <div class="btn-group me-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                        onclick="loadOrders('PENDING')">Pending</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                        onclick="loadOrders('CONFIRMED')">Confirmed</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                        onclick="loadOrders('ALL')">All</button>
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-sm">
                <thead>
                    <tr>
                        <th scope="col">#Order ID</th>
                        <th scope="col">Date</th>
                        <th scope="col">Customer</th>
                        <th scope="col">Total</th>
                        <th scope="col">Payment</th>
                        <th scope="col">Status</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody id="order-table-body">
                    <!-- Data loaded via AJAX -->
                </tbody>
            </table>
        </div>

        <script th:inline="javascript">
            function loadOrders(status) {
                let url = '/admin/api/orders';
                if (status && status !== 'ALL') {
                    url += '?status=' + status;
                }

                $.getJSON(url, function (data) {
                    let html = '';
                    data.forEach(order => {
                        const badgeClass = getStatusBadge(order.status);
                        html += `
                        <tr>
                            <td>${order.orderNumber}</td>
                            <td>${new Date(order.createdAt).toLocaleString()}</td>
                            <td>${order.customerEmail || 'Guest'}</td>
                            <td>${new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(order.totalAmount)}</td>
                            <td>${order.paymentMethod} (${order.paymentStatus})</td>
                            <td><span class="badge bg-${badgeClass}">${order.status}</span></td>
                            <td>
                                <a href="/admin/orders/${order.orderId}" class="btn btn-sm btn-primary">View</a>
                            </td>
                        </tr>
                    `;
                    });
                    $('#order-table-body').html(html);
                });
            }

            function getStatusBadge(status) {
                switch (status) {
                    case 'PENDING': return 'warning';
                    case 'CONFIRMED': return 'info';
                    case 'SUCCESS': return 'success'; // Mapping PaymentStatus
                    case 'PAID': return 'success';
                    case 'CANCELLED': return 'danger';
                    case 'DELIVERED': return 'success';
                    default: return 'secondary';
                }
            }

            $(document).ready(function () {
                loadOrders('ALL');
            });
        </script>
    </div>
</body>

</html>
