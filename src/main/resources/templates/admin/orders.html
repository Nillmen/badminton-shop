<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/admin}">

<head>
    <title>Quản lý Đơn hàng</title>
    <style>
        .filter-section {
            background: white;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        <div class="page-header d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="page-title">Quản lý Đơn hàng</h1>
                <p class="page-subtitle">Xem và quản lý trạng thái các đơn hàng</p>
            </div>
        </div>

        <!-- Filters -->
        <div class="filter-section">
            <div class="row g-3">
                <div class="col-md-3">
                    <select class="form-select" id="statusFilter" onchange="loadOrders()">
                        <option value="">Tất cả trạng thái</option>
                        <option value="PENDING">Chờ xử lý</option>
                        <option value="CONFIRMED">Đã xác nhận</option>
                        <option value="PROCESSING">Đang xử lý</option>
                        <option value="STRINGING">Đang đan vợt</option>
                        <option value="READY_TO_SHIP">Sẵn sàng giao</option>
                        <option value="SHIPPED">Ðang giao hàng</option>
                        <option value="DELIVERED">Đã giao thành công</option>
                        <option value="CANCELLED">Đã hủy</option>
                        <option value="REFUNDED">Đã hoàn tiền</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-secondary w-100" onclick="loadOrders()">
                        <i class="fas fa-redo me-1"></i>Tải lại
                    </button>
                </div>
            </div>
        </div>

        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Đang tải...</span>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4">Mã đơn</th>
                                <th>Khách hàng</th>
                                <th>Ngày tạo</th>
                                <th>Tổng tiền</th>
                                <th>Thanh toán</th>
                                <th>Trạng thái</th>
                                <th class="text-end pe-4">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="orderList"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="emptyState" class="text-center py-5" style="display: none;">
            <p class="text-muted">Không tìm thấy đơn hàng nào</p>
        </div>

        <!-- Update Status Modal -->
        <div class="modal fade" id="updateStatusModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Cập nhật trạng thái đơn hàng</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="updateStatusForm">
                            <input type="hidden" id="updateOrderId">
                            <div class="mb-3">
                                <label class="form-label">Trạng thái mới</label>
                                <select class="form-select" id="newStatus">
                                    <option value="PENDING">Chờ xử lý</option>
                                    <option value="CONFIRMED">Đã xác nhận</option>
                                    <option value="PROCESSING">Đang xử lý</option>
                                    <option value="STRINGING">Đang đan vợt</option>
                                    <option value="READY_TO_SHIP">Sẵn sàng giao</option>
                                    <option value="SHIPPED">Ðang giao hàng</option>
                                    <option value="DELIVERED">Đã giao thành công</option>
                                    <option value="CANCELLED">Đã hủy</option>
                                    <option value="REFUNDED">Đã hoàn tiền</option>
                                </select>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="button" class="btn btn-primary" onclick="submitStatusUpdate()">Lưu thay
                            đổi</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div layout:fragment="scripts">
        <script>
            let updateModal;

            document.addEventListener('DOMContentLoaded', function () {
                updateModal = new bootstrap.Modal(document.getElementById('updateStatusModal'));
                loadOrders();
            });

            async function loadOrders() {
                try {
                    const status = document.getElementById('statusFilter').value;
                    let url = '/admin/api/orders';
                    if (status) url += `?status=${status}`;

                    document.getElementById('loading').style.display = 'block';
                    const response = await fetch(url);
                    const orders = await response.json();

                    renderOrders(orders);
                } catch (error) {
                    console.error('Error loading orders:', error);
                } finally {
                    document.getElementById('loading').style.display = 'none';
                }
            }

            function renderOrders(orders) {
                const container = document.getElementById('orderList');
                const emptyState = document.getElementById('emptyState');

                if (!orders || orders.length === 0) {
                    container.innerHTML = '';
                    emptyState.style.display = 'block';
                    return;
                }

                emptyState.style.display = 'none';
                container.innerHTML = orders.map(o => `
                    <tr>
                        <td class="ps-4 fw-bold">#${o.orderNumber || o.orderId}</td>
                        <td>
                            <div class="d-flex flex-column">
                                <span class="fw-bold text-dark">${o.customerName || 'Unknown'}</span>
                                <small class="text-muted">${o.userId ? 'ID: ' + o.userId : '<span class="badge bg-light text-dark border">Guest</span>'}</small>
                            </div>
                        </td>
                        <td>${new Date(o.createdAt).toLocaleString('vi-VN')}</td>
                        <td class="fw-bold text-primary">${new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(o.totalAmount)}</td>
                        <td><span class="badge ${getPaymentStatusClass(o.paymentStatus)}">${o.paymentStatus}</span></td>
                        <td><span class="badge ${getStatusClass(o.status)}">${getStatusName(o.status)}</span></td>
                        <td class="text-end pe-4">
                            <button class="btn btn-sm btn-outline-primary" onclick="openUpdateModal(${o.orderId}, '${o.status}')">
                                <i class="fas fa-edit me-1"></i>Cập nhật
                            </button>
                        </td>
                    </tr>
                `).join('');
            }

            function openUpdateModal(orderId, currentStatus) {
                document.getElementById('updateOrderId').value = orderId;
                document.getElementById('newStatus').value = currentStatus;
                updateModal.show();
            }

            async function submitStatusUpdate() {
                const orderId = document.getElementById('updateOrderId').value;
                const status = document.getElementById('newStatus').value;

                if (!confirm('Bạn có chắc chắn muốn cập nhật trạng thái đơn hàng?')) return;

                try {
                    const response = await fetch(`/admin/api/orders/${orderId}/status?status=${status}`, {
                        method: 'PUT'
                    });

                    if (response.ok) {
                        alert('Cập nhật thành công!');
                        updateModal.hide();
                        loadOrders();
                    } else {
                        alert('Cập nhật thất bại. Vui lòng thử lại.');
                    }
                } catch (error) {
                    console.error('Error updating order:', error);
                    alert('Lỗi kết nối.');
                }
            }

            function getStatusName(status) {
                const names = {
                    'PENDING': 'Chờ xử lý',
                    'CONFIRMED': 'Đã xác nhận',
                    'PROCESSING': 'Đang xử lý',
                    'STRINGING': 'Đang đan vợt',
                    'READY_TO_SHIP': 'Sẵn sàng giao',
                    'SHIPPED': 'Đang giao hàng',
                    'DELIVERED': 'Đã giao thành công',
                    'CANCELLED': 'Đã hủy',
                    'REFUNDED': 'Đã hoàn tiền'
                };
                return names[status] || status;
            }

            function getStatusClass(status) {
                const classes = {
                    'PENDING': 'bg-secondary',
                    'CONFIRMED': 'bg-primary',
                    'PROCESSING': 'bg-info',
                    'STRINGING': 'bg-warning text-dark',
                    'READY_TO_SHIP': 'bg-primary',
                    'SHIPPED': 'bg-info',
                    'DELIVERED': 'bg-success',
                    'CANCELLED': 'bg-danger',
                    'REFUNDED': 'bg-secondary'
                };
                return classes[status] || 'bg-secondary';
            }

            function getPaymentStatusClass(status) {
                return status === 'PAID' ? 'bg-success' : 'bg-warning text-dark';
            }
        </script>
    </div>
</body>

</html>
