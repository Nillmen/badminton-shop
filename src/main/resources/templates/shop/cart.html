<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/customer}">

<head>
    <title>Giỏ hàng</title>
    <style>
        .cart-item {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }

        .cart-summary {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 100px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .quantity-control input {
            width: 60px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 0.5rem;
        }

        .quantity-control button {
            width: 36px;
            height: 36px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
        }

        .quantity-control button:hover {
            background: #f5f5f5;
        }

        .btn-checkout {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            border: none;
            width: 100%;
        }

        .btn-checkout:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .empty-cart {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-cart i {
            font-size: 5rem;
            color: #ddd;
            margin-bottom: 1.5rem;
        }
    </style>
</head>

<body>
    <main layout:fragment="content">
        <div class="container py-5">
            <h2 class="mb-4"><i class="fas fa-shopping-cart me-2"></i>Giỏ hàng của bạn</h2>

            <div id="cartContent">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Đang tải...</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <th:block layout:fragment="scripts">
        <script>
            // Load cart on page load
            document.addEventListener('DOMContentLoaded', loadCart);

            function loadCart() {
                fetch('/api/cart')
                    .then(response => response.json())
                    .then(cart => renderCart(cart))
                    .catch(error => {
                        console.error('Error loading cart:', error);
                        document.getElementById('cartContent').innerHTML = `
                            <div class="alert alert-danger">Không thể tải giỏ hàng. Vui lòng thử lại.</div>
                        `;
                    });
            }

            function renderCart(cart) {
                const container = document.getElementById('cartContent');

                if (cart.isEmpty) {
                    container.innerHTML = `
                        <div class="empty-cart">
                            <i class="fas fa-shopping-cart"></i>
                            <h3>Giỏ hàng trống</h3>
                            <p class="text-muted">Bạn chưa có sản phẩm nào trong giỏ hàng</p>
                            <a href="/products" class="btn btn-primary mt-3">
                                <i class="fas fa-arrow-left me-2"></i>Tiếp tục mua sắm
                            </a>
                        </div>
                    `;
                    return;
                }

                let itemsHtml = '';
                // Group rackets with stringing to show "Cây 1", "Cây 2" labels
                const racketCounts = {};
                cart.items.forEach(item => {
                    if (item.stringingServiceId) {
                        const key = `${item.productId}_${item.variantId || 'null'}`;
                        racketCounts[key] = (racketCounts[key] || 0) + 1;
                    }
                });

                const racketIndices = {};

                cart.items.forEach(item => {
                    // Determine display price (use promotionPrice if available)
                    const displayPrice = item.promotionPrice || item.unitPrice;
                    const hasPromotion = item.promotionPrice && item.promotionPrice < item.unitPrice;

                    // Calculate subtotal including stringing service price
                    let itemSubtotal = displayPrice * item.quantity;
                    const stringingServicePrice = item.stringingPrice ? parseFloat(item.stringingPrice) * item.quantity : 0;
                    const stringProductPrice = item.stringPrice ? parseFloat(item.stringPrice) * item.quantity : 0;
                    const totalStringingCost = stringingServicePrice + stringProductPrice;
                    itemSubtotal += totalStringingCost;

                    // Calculate racket index for items with stringing
                    let racketLabel = '';
                    const hasStringing = item.stringingServiceId != null;
                    if (hasStringing) {
                        const key = `${item.productId}_${item.variantId || 'null'}`;
                        racketIndices[key] = (racketIndices[key] || 0) + 1;
                        const totalForProduct = racketCounts[key] || 1;
                        if (totalForProduct > 1) {
                            racketLabel = ` - Cây ${racketIndices[key]}`;
                        }
                    }

                    itemsHtml += `
                        <div class="cart-item" data-item-id="${item.cartItemId}">
                            <div class="row align-items-center">
                                <div class="col-md-2">
                                    <img src="${item.productImage || '/images/no-image.png'}" alt="${item.productName}">
                                </div>
                                <div class="col-md-4">
                                    <h5 class="mb-1">
                                        <a href="/products/${item.productSlug}" class="text-decoration-none text-dark">
                                            ${hasStringing ? '🏸 ' : ''}${item.productName}${racketLabel}
                                        </a>
                                    </h5>
                                    ${item.variantName ? `<small class="text-muted">${item.variantName}</small>` : ''}
                                    ${item.stringingServiceName ? `
                                        <div class="small text-info mt-1">
                                            <i class="fas fa-tools me-1"></i>${item.stringingServiceName}
                                            ${item.stringingPrice ? `<span class="text-primary">(+${formatPrice(item.stringingPrice)})</span>` : ''}
                                        </div>
                                    ` : ''}
                                    ${item.stringProductName ? `
                                        <div class="small text-secondary mt-1">
                                            <i class="fas fa-grip-lines me-1"></i>Dây: ${item.stringProductName}
                                            ${item.stringPrice ? `<span class="text-primary">(+${formatPrice(item.stringPrice)})</span>` : ''}
                                        </div>
                                    ` : ''}
                                    ${item.tension ? `<div class="small text-muted"><i class="fas fa-tachometer-alt me-1"></i>Độ căng: ${item.tension} lbs</div>` : ''}
                                    ${item.stringingNotes ? `<div class="small text-muted"><i class="fas fa-comment me-1"></i>${item.stringingNotes}</div>` : ''}
                                    ${hasPromotion ? `<div class="small text-success mt-1"><i class="fas fa-fire me-1"></i>${item.promotionName || 'Đang khuyến mãi'}</div>` : ''}
                                </div>
                                <div class="col-md-2">
                                    ${hasPromotion ? `
                                        <span class="fw-bold text-danger">${formatPrice(item.promotionPrice)}</span>
                                        <br><small class="text-muted text-decoration-line-through">${formatPrice(item.unitPrice)}</small>
                                    ` : `
                                        <span class="fw-bold text-danger">${formatPrice(item.unitPrice)}</span>
                                    `}
                                    ${totalStringingCost > 0 ? `<br><small class="text-info">+${formatPrice(totalStringingCost)} đan vợt</small>` : ''}
                                </div>
                                <div class="col-md-2">
                                    ${hasStringing ? `
                                        <span class="badge bg-info">Đan vợt</span>
                                    ` : `
                                        <div class="quantity-control">
                                            <button onclick="updateQuantity(${item.cartItemId}, ${item.quantity - 1})">−</button>
                                            <input type="number" value="${item.quantity}" min="1" max="99"
                                                onchange="updateQuantity(${item.cartItemId}, parseInt(this.value))">
                                            <button onclick="updateQuantity(${item.cartItemId}, ${item.quantity + 1})">+</button>
                                        </div>
                                    `}
                                </div>
                                <div class="col-md-1">
                                    <span class="fw-bold">${formatPrice(itemSubtotal)}</span>
                                </div>
                                <div class="col-md-1">
                                    <button class="btn btn-link text-danger" onclick="removeItem(${item.cartItemId})">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                // Calculate totals with promotion discounts
                const promotionDiscount = cart.promotionDiscount || 0;
                cartSubtotal = cart.subtotal; // Store for coupon validation

                container.innerHTML = `
                    <div class="row">
                        <div class="col-lg-8">
                            ${itemsHtml}
                            <div class="d-flex justify-content-between mt-3">
                                <a href="/products" class="btn btn-outline-secondary">
                                    <i class="fas fa-arrow-left me-2"></i>Tiếp tục mua sắm
                                </a>
                                <button class="btn btn-outline-danger" onclick="clearCart()">
                                    <i class="fas fa-trash me-2"></i>Xóa giỏ hàng
                                </button>
                            </div>
                        </div>
                        <div class="col-lg-4">
                            <div class="cart-summary">
                                <h5 class="mb-4">Tổng quan</h5>
                                <div class="d-flex justify-content-between mb-2">
                                    <span>Tạm tính</span>
                                    <span>${formatPrice(cart.subtotal)}</span>
                                </div>
                                ${promotionDiscount > 0 ? `
                                <div class="d-flex justify-content-between mb-2 text-success">
                                    <span>Giảm giá khuyến mãi</span>
                                    <span>-${formatPrice(promotionDiscount)}</span>
                                </div>
                                ` : `
                                <div class="d-flex justify-content-between mb-2 text-muted">
                                    <span>Giảm giá</span>
                                    <span>-0₫</span>
                                </div>
                                `}
                                <hr>
                                <div class="d-flex justify-content-between mb-4">
                                    <strong>Tổng cộng</strong>
                                    <strong class="text-danger fs-4" id="totalDisplay">${formatPrice(cart.total)}</strong>
                                </div>
                                
                                <!-- Coupon Section -->
                                <div class="mb-3">
                                    <label class="form-label small">Mã giảm giá</label>
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="couponCode" placeholder="Nhập mã giảm giá">
                                        <button class="btn btn-outline-primary" type="button" onclick="applyCoupon()">Áp dụng</button>
                                    </div>
                                    <div id="couponMessage" class="mt-2"></div>
                                    <div id="appliedCouponDisplay" class="mt-2" style="display: none;">
                                        <div class="d-flex justify-content-between align-items-center bg-success bg-opacity-10 p-2 rounded">
                                            <span class="text-success"><i class="fas fa-check-circle me-1"></i><span id="appliedCouponCode"></span></span>
                                            <button class="btn btn-sm btn-link text-danger" onclick="removeCoupon()"><i class="fas fa-times"></i></button>
                                        </div>
                                    </div>
                                </div>
                                
                                <button class="btn btn-checkout" onclick="checkout()">
                                    Thanh toán ngay &nbsp;<i class="fas fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            function formatPrice(price) {
                return new Intl.NumberFormat('vi-VN').format(price) + '₫';
            }

            function updateQuantity(itemId, quantity) {
                if (quantity < 1) {
                    removeItem(itemId);
                    return;
                }

                fetch(`/api/cart/items/${itemId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ quantity: quantity })
                })
                    .then(response => {
                        if (response.status === 401) {
                            window.location.href = '/login';
                            return;
                        }
                        return response.json();
                    })
                    .then(cart => {
                        if (cart) renderCart(cart);
                        updateCartCount();
                    })
                    .catch(error => console.error('Error:', error));
            }

            function removeItem(itemId) {
                if (!confirm('Bạn có chắc muốn xóa sản phẩm này?')) return;

                fetch(`/api/cart/items/${itemId}`, { method: 'DELETE' })
                    .then(response => response.json())
                    .then(cart => {
                        renderCart(cart);
                        updateCartCount();
                        showToast('Đã xóa sản phẩm khỏi giỏ hàng', 'success');
                    })
                    .catch(error => console.error('Error:', error));
            }

            function clearCart() {
                if (!confirm('Bạn có chắc muốn xóa toàn bộ giỏ hàng?')) return;

                fetch('/api/cart', { method: 'DELETE' })
                    .then(() => {
                        loadCart();
                        updateCartCount();
                        showToast('Đã xóa giỏ hàng', 'success');
                    })
                    .catch(error => console.error('Error:', error));
            }

            function checkout() {
                window.location.href = '/checkout';
            }

            function updateCartCount() {
                fetch('/api/cart/count')
                    .then(response => response.json())
                    .then(data => {
                        const badge = document.querySelector('.cart-count');
                        if (badge) badge.textContent = data.count;
                    })
                    .catch(() => { });
            }

            function showToast(message, type) {
                const toast = document.createElement('div');
                toast.className = `alert alert-${type === 'success' ? 'success' : 'danger'} position-fixed`;
                toast.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
                toast.innerHTML = `
                    <div class="d-flex align-items-center">
                        <i class="fas fa-${type === 'success' ? 'check-circle' : 'times-circle'} me-2"></i>
                        <span>${message}</span>
                        <button type="button" class="btn-close ms-auto" onclick="this.parentElement.parentElement.remove()"></button>
                    </div>
                `;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }

            // ===== COUPON HANDLING =====
            let appliedCoupon = null;
            let cartSubtotal = 0;

            async function applyCoupon() {
                const code = document.getElementById('couponCode').value.trim();
                const messageDiv = document.getElementById('couponMessage');

                console.log('Applying coupon:', code, 'Subtotal:', cartSubtotal);

                if (!code) {
                    messageDiv.innerHTML = '<div class="text-danger small"><i class="fas fa-exclamation-circle me-1"></i>Vui lòng nhập mã giảm giá</div>';
                    return;
                }

                if (!cartSubtotal || cartSubtotal <= 0) {
                    messageDiv.innerHTML = '<div class="text-danger small"><i class="fas fa-exclamation-circle me-1"></i>Giỏ hàng trống hoặc không hợp lệ</div>';
                    return;
                }

                try {
                    const response = await fetch(`/api/coupons/validate?code=${encodeURIComponent(code)}&orderTotal=${cartSubtotal}`, {
                        method: 'POST'
                    });

                    console.log('Response status:', response.status);

                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error('Coupon validation failed:', errorText);
                        messageDiv.innerHTML = '<div class="text-danger small"><i class="fas fa-exclamation-circle me-1"></i>Có lỗi xảy ra, vui lòng thử lại</div>';
                        return;
                    }

                    const result = await response.json();
                    console.log('Coupon validation result:', result);

                    if (result.valid) {
                        appliedCoupon = {
                            code: result.code,
                            name: result.name,
                            discountAmount: result.discountAmount,
                            newTotal: result.newTotal
                        };

                        messageDiv.innerHTML = `<div class="text-success small"><i class="fas fa-check-circle me-1"></i>Giảm ${formatPrice(result.discountAmount)}</div>`;

                        // Update total display
                        document.getElementById('totalDisplay').textContent = formatPrice(result.newTotal);

                        // Show applied coupon
                        document.getElementById('appliedCouponCode').textContent = result.code;
                        document.getElementById('appliedCouponDisplay').style.display = 'block';

                        // Disable input
                        document.getElementById('couponCode').disabled = true;

                        showToast('Áp dụng mã giảm giá thành công!', 'success');

                    } else {
                        appliedCoupon = null;
                        messageDiv.innerHTML = `<div class="text-danger small"><i class="fas fa-exclamation-circle me-1"></i>${result.errorMessage || 'Mã giảm giá không hợp lệ'}</div>`;
                    }
                } catch (error) {
                    console.error('Error validating coupon:', error);
                    messageDiv.innerHTML = '<div class="text-danger small"><i class="fas fa-exclamation-circle me-1"></i>Có lỗi xảy ra, vui lòng thử lại</div>';
                }
            }

            function removeCoupon() {
                // Call API to remove coupon from backend
                fetch('/api/coupons/remove', { method: 'DELETE' })
                    .then(() => {
                        appliedCoupon = null;
                        const couponInput = document.getElementById('couponCode');
                        const couponMessage = document.getElementById('couponMessage');
                        const appliedCouponDisplay = document.getElementById('appliedCouponDisplay');

                        if (couponInput) {
                            couponInput.value = '';
                            couponInput.disabled = false;
                        }
                        if (couponMessage) couponMessage.innerHTML = '';
                        if (appliedCouponDisplay) appliedCouponDisplay.style.display = 'none';

                        // Restore original total
                        loadCart();
                        showToast('Đã hủy mã giảm giá', 'success');
                    })
                    .catch(error => {
                        console.error('Error removing coupon:', error);
                    });
            }

            // Clear coupon when leaving page (unless going to checkout)
            let isNavigatingToCheckout = false;

            function checkout() {
                isNavigatingToCheckout = true;
                window.location.href = '/checkout';
            }

            // Handle page unload - clear coupon if not going to checkout
            window.addEventListener('beforeunload', function (e) {
                if (appliedCoupon && !isNavigatingToCheckout) {
                    // Use sendBeacon for reliable delivery even on page close
                    navigator.sendBeacon('/api/coupons/clear', '');
                }
            });

            // Also handle page visibility change (for mobile)
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'hidden' && appliedCoupon && !isNavigatingToCheckout) {
                    navigator.sendBeacon('/api/coupons/clear', '');
                }
            });
        </script>
    </th:block>
</body>

</html>
