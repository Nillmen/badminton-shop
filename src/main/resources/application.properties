# ============================================
# BADMINTON SHOP - Main Application Properties
# ============================================

# Active Profile (dev, prod, test)
spring.profiles.active=dev

# ==================== SERVER ====================
server.port=8080
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==================== DATABASE (MySQL) ====================
spring.datasource.url=jdbc:mysql://localhost:3306/badminton_shop?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Tuong@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==================== APPLICATION INFO ====================
spring.application.name=Badminton Shop
app.version=1.0.0
app.description=E-commerce platform for badminton equipment

# ==================== THYMELEAF ====================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html;charset=UTF-8
# Disable cache in development (override in prod)
spring.thymeleaf.cache=false    

# ==================== STATIC RESOURCES ====================
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/static/**

# ==================== FILE UPLOAD ====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
# Local upload directory (for development)
app.upload.dir=uploads
app.upload.allowed-extensions=jpg,jpeg,png,gif,webp,pdf

# ==================== JACKSON (JSON) ====================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.fail-on-empty-beans=false

# ==================== INTERNATIONALIZATION ====================
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ==================== ERROR HANDLING ====================
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# ==================== ACTUATOR (MONITORING) ====================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# ==================== SPRINGDOC (SWAGGER) ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false

# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.com.badmintonshop=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/badminton-shop.log
logging.file.max-size=10MB
logging.file.max-history=30

# ==================== CUSTOM APP PROPERTIES ====================
# Shop info
app.shop.name=Badminton Shop
app.shop.email=contact@badmintonshop.vn
app.shop.phone=0909123456
app.shop.address=123 Đường ABC, Quận 1, TP.HCM

# Currency
app.currency=VND
app.currency.symbol=₫

# Pagination defaults
app.pagination.default-page-size=12
app.pagination.max-page-size=100

# Cart settings
app.cart.max-items=20
app.cart.expire-days=7

# Order settings
app.order.number-prefix=ORD

# Stringing service
app.stringing.default-time-minutes=30
# Validate entity mapping với database schema
spring.jpa.hibernate.ddl-auto=update

# Hiển thị SQL queries
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ======================== VNPay Configuration ========================
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:8080/api/payment/vnpay-return
vnpay.tmnCode=TESTCODE
